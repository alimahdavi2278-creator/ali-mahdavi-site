<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>علوم ششم ابتدایی</title>

<style>
body{
    font-family:tahoma,sans-serif;
    background:#071426;
    color:white;
    margin:0;
}

header{
    background:#0e2242;
    text-align:center;
    padding:40px;
}

h1{
    color:#d4af37;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px;
}

.card{
    background:#10284a;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    border:1px solid #d4af37;
}

a{
    color:#d4af37;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<header>
    <h1>علوم ششم ابتدایی</h1>
    <p>محتواهای آموزشی تهیه شده توسط سیدعلی مهدوی سعیدآبادی</p>
</header>

<div class="container">

    <div class="card">
        <h2>درس نهم</h2>
        <p>فایل آموزشی و</p>
        <a href="#">مشاهده محتوا</a>
    </div>

    <div class="card">
        <h2>درس دهم</h2>
        <p>فایل آموزشی </p>
        <a href="#">مشاهده محتوا</a>
    </div>

    <div class="card">
        <h2>درس یازدهم</h2>
        <p>فایل آموزشی و نمونه سوال</p>
        <a href="#">مشاهده محتوا</a>
    </div>

</div>

</body>
</html>
